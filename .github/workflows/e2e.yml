name: End-to-End
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simple-test:
    name: Simple Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup terraform
        uses: step-security/setup-terraform@v4
      - name: Setup - initialize
        run: terraform init
        working-directory: tests/ci/0-setup
      - name: Setup - apply
        run: terraform apply -auto-approve -state ../.tfstate
        working-directory: tests/ci/0-setup
      - name: Change - initialize
        run: terraform init
        working-directory: tests/ci/1-change
      - name: Change - plan
        run: terraform plan -state ../.tfstate -out .planfile
        working-directory: tests/ci/1-change
      - name: Post PR comment
        uses: ./
        with:
          token: ${{ github.token }}
          planfile: .planfile
          working-directory: tests/ci/1-change
          skip-comment: ${{ github.event.pull_request.head.repo.full_name != 'step-security/terraform-plan-comment' }}
